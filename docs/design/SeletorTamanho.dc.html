<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Seletor de tamanho aberto</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Instrument+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#9A4426}a:hover{color:#7A361E}
.app{font-family:'Instrument Sans',system-ui,sans-serif;color:#1F1B16;font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
.serif{font-family:'Newsreader',Georgia,serif;font-weight:500;letter-spacing:-.01em}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.btn{font:inherit;font-weight:500;min-height:36px;padding:0 14px;border:1px solid #DDD5C8;background:#fff;border-radius:8px;color:#1F1B16;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;white-space:nowrap;box-sizing:border-box}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#EFEAE1;border-radius:8px;padding:3px;gap:2px}
.seg button{font:inherit;font-weight:500;font-size:13px;min-height:30px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:#8E8579;cursor:not-allowed;white-space:nowrap}
.lbl{font-size:12px;font-weight:500;color:#5A5248}
.opt{font:inherit;font-family:'IBM Plex Mono',monospace;width:100%;display:flex;align-items:center;justify-content:space-between;min-height:30px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:#1F1B16;cursor:pointer;text-align:left;box-sizing:border-box}
.grp{font-size:12px;font-weight:500;color:#6E655A;padding:8px 10px 4px}
.p1{background:linear-gradient(165deg,#F4CF9C 0%,#E3966A 45%,#9C5545 75%,#4D2D2E 100%)}
.tip{position:absolute;background:#1F1B16;color:#fff;font-size:12px;border-radius:6px;padding:6px 10px;white-space:nowrap}
</style>
</helmet>
<div class="app" style="width: 360px; height: 900px; box-sizing: border-box; background: #fff; border-left: 1px solid #E6DFD3; padding: 18px; display: flex; flex-direction: column; gap: 18px; position: relative">
  <div style="display: flex; gap: 12px; align-items: center">
    <div class="p1" style="width: 46px; height: 46px; border-radius: 4px; flex: none; outline: 4px solid #fff; box-shadow: 0 0 0 5px #E6DFD3"></div>
    <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; padding-left: 4px">
      <span class="serif" style="font-size: 18px">IMG_2041.jpg</span>
      <span style="font-size: 12px; color: #6E655A">Retrato natural</span>
    </div>
  </div>
  <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span class="lbl" id="lt">Tamanho</span>
      <button class="btn" aria-haspopup="listbox" aria-expanded="true" aria-labelledby="lt" style="justify-content: space-between; padding: 0 10px; width: 100%; border-color: #B5532F; box-shadow: 0 0 0 2px #B5532F33"><span class="mono">15 × 15</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M18 15l-6-6-6 6"></path></svg></button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span class="lbl" style="color: #8E8579">Orientação</span>
      <div class="seg" style="width: 152px" title="Tamanho quadrado: orientação não se aplica"><button disabled>Retrato</button><button disabled>Paisagem</button></div>
    </div>
  </div>
  <div role="listbox" aria-label="Tamanho" style="position: absolute; left: 18px; top: 150px; z-index: 6; width: 170px; background: #fff; border: 1px solid #E6DFD3; border-radius: 10px; box-shadow: 0 12px 28px #1F1B1629; padding: 6px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <div class="grp">{{g.nome}}</div>
      <sc-for list="{{g.itens}}" as="i" hint-placeholder-count="5">
        <button role="option" class="opt" aria-selected="{{i.sel}}" style="background: {{i.bg}}"><span>{{i.label}}</span><sc-if value="{{i.isSel}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B5532F" stroke-width="2" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></sc-if></button>
      </sc-for>
    </sc-for>
    <div style="height: 1px; background: #F0EBE3; margin: 6px 4px"></div>
    <button role="option" class="opt" style="font-family: 'Instrument Sans', system-ui, sans-serif">Personalizado…</button>
  </div>
  <span class="tip" role="tooltip" style="left: 196px; top: 146px">Quadrado: sem orientação</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const sel = '15 × 15';
    const g = [
      ['Padrão', ['10 × 15', '13 × 18', '15 × 21', '20 × 25', '20 × 30']],
      ['Quadrados', ['13 × 13', '15 × 15']],
      ['Grandes', ['30 × 40', '30 × 45', '40 × 50', '40 × 60', '50 × 60', '50 × 70', '60 × 80', '60 × 90', '70 × 100', '75 × 120']]
    ];
    return {
      groups: g.map(([nome, itens]) => ({ nome, itens: itens.map((label) => ({
        label, isSel: label === sel, sel: label === sel ? 'true' : 'false', bg: label === sel ? '#F3E1D8' : 'transparent'
      })) }))
    };
  }
}
</script>
</body>
</html>
