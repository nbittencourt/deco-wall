<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Projetos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Instrument+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#F7F4EE}
a{color:#9A4426}a:hover{color:#7A361E}
.app{font-family:'Instrument Sans',system-ui,sans-serif;color:#1F1B16;font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
.serif{font-family:'Newsreader',Georgia,serif;font-weight:500;letter-spacing:-.01em}
.btn{font:inherit;font-weight:500;min-height:40px;padding:0 16px;border:1px solid #DDD5C8;background:#fff;border-radius:8px;color:#1F1B16;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;white-space:nowrap;box-sizing:border-box}
.btn-p{background:#B5532F;border-color:#B5532F;color:#fff}.btn-p:hover{background:#9A4426;color:#fff}
.btn-g{background:transparent;border-color:transparent}
.in{font:inherit;min-height:40px;border:1px solid #DDD5C8;border-radius:8px;padding:0 12px 0 36px;box-sizing:border-box;background:#fff;color:#1F1B16}
.in[disabled]{background:#F7F4EE;color:#8E8579;cursor:not-allowed}
.card{position:relative;background:#fff;border:1px solid #E6DFD3;border-radius:12px;display:flex;flex-direction:column;transition:box-shadow .15s}
.card:hover{box-shadow:0 10px 28px #5A524824}
.mi{font:inherit;display:flex;align-items:center;gap:10px;width:100%;min-height:36px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:#1F1B16;cursor:pointer;text-align:left}
.mi:hover{background:#F3EEE6}
</style>
</helmet>
<div class="app" style="min-height: 900px; background: #F7F4EE">
  <header style="display: flex; align-items: center; gap: 12px; padding: 16px 32px; border-bottom: 1px solid #E6DFD3; background: #F7F4EE">
    <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="4" width="12" height="16" rx="1.5" fill="#B5532F"></rect><rect x="17" y="4" width="13" height="9" rx="1.5" fill="#1F1B16"></rect><rect x="17" y="16" width="13" height="12" rx="1.5" fill="#D9C9B4"></rect><rect x="2" y="23" width="12" height="5" rx="1.5" fill="#D9C9B4"></rect></svg>
    <span class="serif" style="font-size: 21px">Simulador de Parede</span>
  </header>
  <div style="max-width: 1160px; margin: 0 auto; padding: 48px 32px; display: flex; flex-direction: column; gap: 32px">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 class="serif" style="margin: 0; font-size: 44px; font-weight: 500; line-height: 1.05">Projetos</h1>
        <span style="color: #5A5248">Uma parede por projeto. As fotos da biblioteca valem para todos.</span>
      </div>
      <div style="flex: 1 1 20px"></div>
      <div style="position: relative" title="Disponível em uma próxima versão">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8E8579" stroke-width="1.8" aria-hidden="true" style="position: absolute; left: 12px; top: 12px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input class="in" placeholder="Buscar projeto" aria-label="Buscar projeto" disabled style="width: 260px">
      </div>
      <a href="Vazio.dc.html" class="btn btn-p"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Novo projeto</a>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px">
      <sc-for list="{{projetos}}" as="p" hint-placeholder-count="4">
        <article class="card">
          <a href="{{p.href}}" aria-label="Abrir {{p.nome}}" style="display: block; position: relative; height: 168px; border-radius: 11px 11px 0 0; overflow: hidden; background: {{p.wall}}; text-decoration: none">
            <sc-if value="{{p.temParede}}" hint-placeholder-val="{{true}}">
              <span style="position: absolute; left: 0; right: 0; bottom: 0; height: 22px; background: {{p.floor}}"></span>
              <span style="position: absolute; left: {{p.mx}}; width: {{p.mw}}; bottom: 22px; height: {{p.mh}}; background: {{p.movel}}; border-radius: {{p.mr}}"></span>
              <span style="position: absolute; left: {{p.ox}}; top: 30px; width: 36px; height: 92px; background: #F4EFE6; border: 2px solid #CFC5B6; box-sizing: border-box; display: {{p.porta}}"></span>
            </sc-if>
            <sc-if value="{{p.semParede}}" hint-placeholder-val="{{false}}">
              <span style="position: absolute; inset: 0; display: flex; flex-direction: column; gap: 6px; align-items: center; justify-content: center; color: #6E655A; font-size: 13px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 17l-5-5-9 8"></path></svg>Sem foto da parede</span>
            </sc-if>
          </a>
          <div style="padding: 16px; display: flex; flex-direction: column; gap: 6px">
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
              <a href="{{p.href}}" class="serif" style="font-size: 20px; color: #1F1B16; text-decoration: none">{{p.nome}}</a>
              <button class="btn btn-g" aria-label="Mais ações" aria-haspopup="menu" aria-expanded="{{p.exp}}" style="min-height: 32px; width: 32px; padding: 0; background: {{p.mbg}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="#5A5248" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg></button>
            </div>
            <span style="font-size: 13px; color: #5A5248">{{p.meta}}</span>
            <sc-if value="{{p.ph}}" hint-placeholder-val="{{false}}">
              <span style="align-self: flex-start; font-size: 12px; color: #9F1D14; background: #FBE9E6; border-radius: 999px; padding: 2px 10px">{{p.ph}}</span>
            </sc-if>
          </div>
          <sc-if value="{{p.menu}}" hint-placeholder-val="{{false}}">
            <div role="menu" style="position: absolute; right: 12px; top: 216px; z-index: 5; width: 180px; background: #fff; border: 1px solid #E6DFD3; border-radius: 10px; box-shadow: 0 12px 28px #1F1B1629; padding: 6px">
              <button role="menuitem" class="mi"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 20h4l10-10-4-4L4 16z"></path><path d="M13.5 6.5l4 4"></path></svg>Renomear</button>
              <button role="menuitem" class="mi" style="color: #9F1D14"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>Excluir</button>
            </div>
          </sc-if>
        </article>
      </sc-for>
      <a href="Vazio.dc.html" style="min-height: 268px; border: 1.5px dashed #CFC5B6; border-radius: 12px; display: flex; flex-direction: column; gap: 8px; align-items: center; justify-content: center; color: #5A5248; text-decoration: none">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        Novo projeto
      </a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const base = { temParede: true, semParede: false, menu: false, exp: 'false', mbg: 'transparent', porta: 'none', ox: '0px' };
    return {
      projetos: [
        { ...base, nome: 'Sala de estar', href: 'Main.dc.html', meta: '3 variantes · editado hoje, 14:35', ph: '1 variante com foto faltando',
          wall: 'linear-gradient(180deg,#EDE6DA 0%,#E2D8C8 100%)', floor: '#D3C6B3', movel: '#8F7D68', mx: '50px', mw: '170px', mh: '46px', mr: '14px 14px 4px 4px',
          menu: true, exp: 'true', mbg: '#F3EEE6' },
        { ...base, nome: 'Corredor', href: 'Main.dc.html', meta: '1 variante · editado em 12/10', ph: '',
          wall: 'linear-gradient(180deg,#E6E4DE 0%,#D6D3CB 100%)', floor: '#B9A58C', movel: '#6E5A49', mx: '80px', mw: '110px', mh: '30px', mr: '3px', porta: 'block', ox: '200px' },
        { ...base, nome: 'Quarto', href: 'Main.dc.html', meta: '2 variantes · editado em 02/10', ph: '',
          wall: 'linear-gradient(180deg,#E9DDD3 0%,#DCCBBE 100%)', floor: '#CDBBA6', movel: '#B79C80', mx: '40px', mw: '190px', mh: '38px', mr: '10px 10px 3px 3px' },
        { ...base, nome: 'Escritório', href: 'Vazio.dc.html', meta: '1 variante · parede não definida', ph: '', temParede: false, semParede: true,
          wall: '#EFEAE1', floor: 'transparent', movel: 'transparent', mx: '0px', mw: '0px', mh: '0px', mr: '0' }
      ]
    };
  }
}
</script>
</body>
</html>
