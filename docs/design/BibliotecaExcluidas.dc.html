<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Biblioteca — Excluídas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Instrument+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#9A4426}a:hover{color:#7A361E}
.app{font-family:'Instrument Sans',system-ui,sans-serif;color:#1F1B16;font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
.serif{font-family:'Newsreader',Georgia,serif;font-weight:500;letter-spacing:-.01em}
.btn{font:inherit;font-weight:500;min-height:36px;padding:0 14px;border:1px solid #DDD5C8;background:#fff;border-radius:8px;color:#1F1B16;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;white-space:nowrap;box-sizing:border-box}
.btn-p{background:#B5532F;border-color:#B5532F;color:#fff}
.seg{display:grid;background:#EFEAE1;border-radius:8px;padding:3px;gap:2px}
.seg button{font:inherit;font-weight:500;min-height:30px;padding:0 6px;border:0;border-radius:6px;background:transparent;color:#5A5248;cursor:pointer}
.seg .on{background:#fff;color:#1F1B16;box-shadow:0 1px 2px #1F1B1624}
.p2{background:linear-gradient(180deg,#BFD6E2 0%,#7FA8BE 48%,#3F6A80 70%,#26404D 100%)}
.p4{background:radial-gradient(circle at 50% 38%,#EBDCC8 0 18%,#B79C80 19% 40%,#6E5A49 75%)}
.p5{background:linear-gradient(200deg,#E2DDF0 0%,#A7A0C6 45%,#5E5781 75%,#353050 100%)}
.p8{background:radial-gradient(circle at 70% 30%,#F7E7C6 0 12%,#D9A45F 30%,#7C4A2C 80%)}
.hatch{background:repeating-linear-gradient(45deg,#B4231833 0 6px,#FBEDEA 6px 12px)}
</style>
</helmet>
<div class="app" style="width: 360px; height: 900px; box-sizing: border-box; background: #fff; border-right: 1px solid #E6DFD3; padding: 16px; display: flex; flex-direction: column; gap: 14px">
  <div style="display: flex; align-items: baseline; justify-content: space-between">
    <span class="serif" style="font-size: 20px">Biblioteca</span>
    <span style="font-size: 12px; color: #6E655A">3 excluídas</span>
  </div>
  <div class="seg" style="grid-template-columns: repeat(3, minmax(0, 1fr)) 34px">
    <button>Todas</button><button>Projeto</button><button>Variante</button><button class="on" aria-label="Mais filtros" style="padding: 0">⋯</button>
  </div>
  <div style="display: flex; align-items: center; gap: 8px">
    <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; background: #F3E1D8; color: #7A361E; border-radius: 999px; padding: 3px 6px 3px 12px">Excluídas<button aria-label="Limpar filtro" style="width: 20px; height: 20px; border: 0; border-radius: 10px; background: transparent; color: inherit; cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></span>
  </div>
  <p style="margin: 0; font-size: 13px; color: #5A5248">Removidas definitivamente após 30 dias. Restaurar não devolve a foto às composições.</p>
  <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{itens}}" as="i" hint-placeholder-count="3">
      <li style="display: flex; gap: 12px; align-items: center; padding: 8px; border: 1px solid #F0EBE3; border-radius: 10px">
        <span class="{{i.c}}" style="width: 44px; height: 56px; border-radius: 6px; flex: none; opacity: .55; filter: grayscale(.4)"></span>
        <span style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
          <span style="font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{i.nome}}</span>
          <span style="font-size: 12px; color: {{i.cor}}">{{i.dias}}</span>
        </span>
        <button class="btn" style="min-height: 32px; padding: 0 10px; font-size: 13px">Restaurar</button>
      </li>
    </sc-for>
  </ul>
  <div style="margin-top: 10px; padding-top: 18px; border-top: 1px solid #F0EBE3; display: flex; flex-direction: column; gap: 12px">
    <span class="serif" style="font-size: 18px">Espaço sem foto</span>
    <div style="display: flex; gap: 12px; align-items: center">
      <div class="hatch" style="width: 60px; height: 40px; border: 1.5px dashed #B42318; box-sizing: border-box; flex: none; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9F1D14" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 3l18 18"></path></svg></div>
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px">10x15 paisagem</span>
        <span style="font-size: 12px; color: #5A5248">Arraste uma foto ou escolha abaixo</span>
      </span>
    </div>
    <div style="padding: 10px; border: 2px solid #B5532F; background: #FBF4F0; border-radius: 10px; display: flex; gap: 10px; align-items: center">
      <span class="p8" style="width: 48px; height: 32px; border-radius: 4px; flex: none"></span>
      <span style="display: flex; flex-direction: column; flex: 1; min-width: 0">
        <span style="font-size: 12px; font-weight: 600; color: #7A361E">Foto anterior, restaurada</span>
        <span style="font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">festa_sao_joao.jpg</span>
      </span>
      <button class="btn btn-p" style="min-height: 32px; padding: 0 12px">Usar</button>
    </div>
    <button class="btn">Escolher outra na biblioteca</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      itens: [
        { nome: 'retrato_vo_antigo.jpg', dias: '28 dias restantes', cor: '#5A5248', c: 'p4' },
        { nome: 'entardecer_2019.webp', dias: '12 dias restantes', cor: '#5A5248', c: 'p5' },
        { nome: 'praia_duplicada.jpg', dias: '2 dias restantes', cor: '#9F1D14', c: 'p2' }
      ]
    };
  }
}
</script>
</body>
</html>
