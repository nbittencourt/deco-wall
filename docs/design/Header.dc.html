<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Header do editor em 1440 e 1280</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Instrument+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#ECE6DC}
a{color:#9A4426}a:hover{color:#7A361E}
.app{font-family:'Instrument Sans',system-ui,sans-serif;color:#1F1B16;font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
.serif{font-family:'Newsreader',Georgia,serif;font-weight:500;letter-spacing:-.01em}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.btn{font:inherit;font-weight:500;min-height:36px;padding:0 14px;border:1px solid #DDD5C8;background:#fff;border-radius:8px;color:#1F1B16;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;white-space:nowrap;box-sizing:border-box}
.btn-p{background:#B5532F;border-color:#B5532F;color:#fff}
.btn-g{background:transparent;border-color:transparent}
.btn-i{width:36px;padding:0}
.hb{padding:0 9px;gap:6px}
.off{color:#8E8579;cursor:not-allowed}
.tgl{font:inherit;font-weight:500;min-height:36px;padding:0 10px;border:1px solid #EFEAE1;border-radius:8px;background:#EFEAE1;color:#1F1B16;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.sep{width:1px;height:24px;background:#DDD5C8;margin:0 2px}
.chip{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#5A5248;background:#EFEAE1;border-radius:6px;padding:3px 8px;white-space:nowrap}
.mi{font:inherit;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:36px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:#1F1B16;cursor:pointer;text-align:left;box-sizing:border-box}
.tip{position:relative;background:#1F1B16;color:#fff;font-size:12px;border-radius:6px;padding:6px 10px;white-space:nowrap}
</style>
</helmet>
<div class="app" style="width: 1440px; height: 560px; box-sizing: border-box; background: #ECE6DC; padding: 28px 0; display: flex; flex-direction: column; gap: 22px">
  <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
    <div style="display: flex; flex-direction: column; gap: 8px; position: relative">
      <span class="mono" style="font-size: 12px; color: #5A5248; padding: 0 0 0 4px">{{r.label}}</span>
      <header style="width: {{r.w}}; box-sizing: border-box; display: flex; align-items: center; gap: 4px; padding: 10px 12px; background: #FFFFFF; border-bottom: 1px solid #E6DFD3; box-shadow: 0 1px 2px #5A52481f">
        <button class="btn btn-g btn-i" aria-label="Voltar para projetos"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
        <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="4" width="12" height="16" rx="1.5" fill="#B5532F"></rect><rect x="17" y="4" width="13" height="9" rx="1.5" fill="#1F1B16"></rect><rect x="17" y="16" width="13" height="12" rx="1.5" fill="#D9C9B4"></rect><rect x="2" y="23" width="12" height="5" rx="1.5" fill="#D9C9B4"></rect></svg>
        <span class="serif" style="font-size: 18px; margin: 0 6px; max-width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Sala de estar</span>
        <button class="btn hb">Base <span style="font-size: 12px; color: #9F1D14; background: #FBE9E6; border-radius: 999px; padding: 1px 8px">1 sem foto</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
        <button class="btn btn-g hb">Comparar</button>
        <div class="sep"></div>
        <button class="btn btn-g hb">Templates</button>
        <sc-if value="{{r.wide}}" hint-placeholder-val="{{true}}">
          <button class="btn btn-g hb">Área útil</button>
          <button class="btn btn-g hb">Perspectiva</button>
          <button class="btn btn-g hb">Calibrar</button>
          <span class="chip" style="margin: 0 2px">4,0 px/cm</span>
          <button class="btn btn-g hb off" aria-disabled="true" title="Disponível em uma próxima versão">Parede</button>
        </sc-if>
        <sc-if value="{{r.narrow}}" hint-placeholder-val="{{false}}">
          <span class="chip" style="margin: 0 2px">4,0 px/cm</span>
          <button class="btn btn-g hb" aria-haspopup="menu" aria-expanded="{{r.exp}}" style="background: {{r.mbg}}">Parede<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
        </sc-if>
        <div class="sep"></div>
        <button class="tgl" aria-pressed="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 9h18M3 15h18M9 3v18M15 3v18"></path></svg><span class="mono" style="font-size: 13px">5 cm</span></button>
        <button class="tgl btn-i" aria-pressed="true" aria-label="Encaixar no grid" style="padding: 0; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M6 3v8a6 6 0 0012 0V3"></path><path d="M6 7h4M14 7h4"></path></svg></button>
        <div class="sep"></div>
        <button class="btn btn-g btn-i" aria-label="Desfazer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10a6 6 0 010 12h-3"></path></svg></button>
        <button class="btn btn-g btn-i" aria-label="Refazer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M15 14l5-5-5-5"></path><path d="M20 9H10a6 6 0 000 12h3"></path></svg></button>
        <div style="flex: 1 1 8px"></div>
        <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #5A5248; margin-right: 6px; white-space: nowrap"><span style="width: 7px; height: 7px; border-radius: 4px; background: #5E7A44"></span>Salvo 14:35</span>
        <button class="btn hb" title="Salvar (Ctrl+S)">Salvar</button>
        <button class="btn btn-p hb" style="padding: 0 12px">Exportar</button>
      </header>
      <sc-if value="{{r.menu}}" hint-placeholder-val="{{false}}">
        <div role="menu" style="position: absolute; left: 620px; top: 80px; z-index: 5; width: 230px; background: #fff; border: 1px solid #E6DFD3; border-radius: 10px; box-shadow: 0 12px 28px #1F1B1629; padding: 6px">
          <button role="menuitem" class="mi">Área útil</button>
          <button role="menuitem" class="mi">Perspectiva</button>
          <button role="menuitem" class="mi">Calibrar</button>
          <div style="height: 1px; background: #F0EBE3; margin: 4px"></div>
          <button role="menuitem" class="mi off" aria-disabled="true">Parede</button>
        </div>
        <span class="tip" role="tooltip" style="position: absolute; left: 858px; top: 207px">Disponível em uma próxima versão</span>
      </sc-if>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const r = (label, w, wide, menu) => ({ label, w, wide, narrow: !wide, menu, exp: menu ? 'true' : 'false', mbg: menu ? '#F3EEE6' : 'transparent' });
    return {
      rows: [
        r('1440 px · tudo visível', '1440px', true, false),
        r('1280 px · Área útil, Perspectiva, Calibrar e Parede agrupados em “Parede ▾”', '1280px', false, false),
        r('1280 px · menu “Parede” aberto', '1280px', false, true)
      ]
    };
  }
}
</script>
</body>
</html>
